[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mi-poker"
version = "0.1.0"
description = "Texas Hold'em No-Limit contra bots. Solo para entretenimiento, sin dinero real."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["poker_engine", "bots", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
