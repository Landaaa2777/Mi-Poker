[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mi-poker"
version = "0.1.0"
description = "Texas Hold'em No-Limit contra bots. Solo para entretenimiento, sin dinero real."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["poker_engine", "bots"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
